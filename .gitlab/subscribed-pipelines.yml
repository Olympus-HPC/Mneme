tioga-up-check:
  variables:
    CI_MACHINE: "tioga"
  extends: [.machine-check]

tuolumne-up-check:
  variables:
    CI_MACHINE: "tuolumne"
  extends: [.machine-check]

# C/C++ Tests
tioga-build-and-test:
  variables:
    CI_MACHINE: "tioga"
  needs: [tioga-up-check]
  extends: [.build-and-test]

tuolumne-build-and-test:
  variables:
    CI_MACHINE: "tuolumne"
  needs: [tuolumne-up-check]
  extends: [.build-and-test]

tioga-examples:
  variables:
    CI_MACHINE: "tioga"
  needs: [tioga-up-check]
  extends: [.examples]

lassen-build-and-test:
  variables:
    CI_MACHINE: "lassen"
  needs: [lassen-up-check]
  extends: [.build-and-test]

lassen-examples:
  variables:
    CI_MACHINE: "lassen"
  needs: [lassen-up-check]
  extends: [.examples]


## Python tests
tioga-test-python-cov:
  variables:
    CI_MACHINE: "tioga"
    JOB_CMD:
      value: "scripts/gitlab/ci-python-test.sh"
      expand: false
  needs: [tioga-up-check]
  extends: [.test-python-cov]

tuolumne-test-python-cov:
  variables:
    CI_MACHINE: "tuolumne"
    JOB_CMD:
      value: "scripts/gitlab/ci-python-test.sh"
      expand: false
  needs: [tuolumne-up-check]
  extends: [.test-python-cov]


