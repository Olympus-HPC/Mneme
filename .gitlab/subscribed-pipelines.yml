# The template job to test whether a machine is up.
# Expects CI_MACHINE defined to machine name.
.machine-check:
  stage: prerequisites
  tags: [shell, oslic]
  variables:
    GIT_STRATEGY: none
  script:
    - |
      if [[ $(jq '.[env.CI_MACHINE].total_nodes_up' /usr/global/tools/lorenz/data/loginnodeStatus) == 0 ]]
      then
        echo -e "\e[31mNo node available on ${CI_MACHINE}\e[0m"
        curl --url "https://api.github.com/repos/${GITHUB_PROJECT_ORG}/${GITHUB_PROJECT_NAME}/statuses/${CI_COMMIT_SHA}" \
             --header 'Content-Type: application/json' \
             --header "authorization: Bearer ${GITHUB_TOKEN}" \
             --data "{ \"state\": \"failure\", \"target_url\": \"${CI_PIPELINE_URL}\", \"description\": \"GitLab ${CI_MACHINE} down\", \"context\": \"ci/gitlab/${CI_MACHINE}\" }"
        exit 1
      fi

#################################
#    System Up Check            #
#################################

# MATRIX
matrix-up-check:
  variables:
    CI_MACHINE: "matrix"
  extends: [.machine-check]

tioga-up-check:
  variables:
    CI_MACHINE: "tioga"
  extends: [.machine-check]

tuolumne-up-check:
  variables:
    CI_MACHINE: "tuolumne"
  extends: [.machine-check]

#################################
#       C/C++ Tests             #
#################################
matrix-build-and-test:
  variables:
    CI_MACHINE: "matrix"
  needs: [matrix-up-check]
  extends: [.build-and-test]

tioga-build-and-test:
  variables:
    CI_MACHINE: "tioga"
  needs: [tioga-up-check]
  extends: [.build-and-test]

tuolumne-build-and-test:
  variables:
    CI_MACHINE: "tuolumne"
  needs: [tuolumne-up-check]
  extends: [.build-and-test]


#################################
#       Python Tests            #
#################################
tioga-test-python-cov:
  variables:
    CI_MACHINE: "tioga"
    JOB_CMD:
      value: "scripts/gitlab/ci-python-test.sh"
      expand: false
  needs: [tioga-up-check]
  extends: [.test-python-cov]

tuolumne-test-python-cov:
  variables:
    CI_MACHINE: "tuolumne"
    JOB_CMD:
      value: "scripts/gitlab/ci-python-test.sh"
      expand: false
  needs: [tuolumne-up-check]
  extends: [.test-python-cov]


